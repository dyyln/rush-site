# Local dev and base stack for the AX box.
# The Go host agent and CS2 run on the host, not in Docker.
# Production overrides live in docker-compose.prod.yml.

name: rushsite

x-api-env: &api-env
  NODE_ENV: ${NODE_ENV:-development}
  PORT: "3001"
  HOST: 0.0.0.0
  DATABASE_URL: postgres://${POSTGRES_USER:-rushsite}:${POSTGRES_PASSWORD:-rushsite}@postgres:5432/${POSTGRES_DB:-rushsite}
  REDIS_URL: redis://redis:6379
  DB_MIGRATE_ON_START: ${DB_MIGRATE_ON_START:-true}
  SESSION_SECRET: ${SESSION_SECRET:?set SESSION_SECRET in .env}
  COOKIE_DOMAIN: ${COOKIE_DOMAIN:-}
  ADMIN_STEAM_IDS: ${ADMIN_STEAM_IDS:-}
  PUBLIC_URL: ${PUBLIC_URL:-http://localhost:3000}
  API_PUBLIC_URL: ${API_PUBLIC_URL:-http://localhost:3001}
  STEAM_API_KEY: ${STEAM_API_KEY:-}
  FACEIT_API_KEY: ${FACEIT_API_KEY:-}
  RUSHSITE_AGENT_TOKEN: ${RUSHSITE_AGENT_TOKEN:?set RUSHSITE_AGENT_TOKEN in .env}
  AGENT_URLS: ${AGENT_URLS:-http://host.docker.internal:8080}
  GSLT_TOKENS: ${GSLT_TOKENS:-}
  # Dev talks to the minio container. The prod override points at real storage.
  S3_ENDPOINT: http://minio:9000
  S3_PUBLIC_ENDPOINT: ${S3_PUBLIC_ENDPOINT:-http://localhost:9000}
  S3_REGION: ${S3_REGION:-us-east-1}
  S3_BUCKET: ${S3_BUCKET:-rushsite-demos}
  S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID:-rushsite}
  S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY:-rushsite-dev-secret}
  S3_FORCE_PATH_STYLE: ${S3_FORCE_PATH_STYLE:-true}
  LOG_LEVEL: ${LOG_LEVEL:-info}

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-rushsite}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-rushsite}
      POSTGRES_DB: ${POSTGRES_DB:-rushsite}
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:${POSTGRES_HOST_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 20

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redisdata:/data
    ports:
      - "127.0.0.1:6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  minio:
    # Docker Hub no longer carries minio images. Pinned from quay.io.
    image: quay.io/minio/minio:RELEASE.2025-09-07T16-13-09Z
    restart: unless-stopped
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY_ID:-rushsite}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_ACCESS_KEY:-rushsite-dev-secret}
    volumes:
      - miniodata:/data
    ports:
      - "127.0.0.1:9000:9000"
      - "127.0.0.1:9001:9001"
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 3s
      retries: 20

  # Creates the demo bucket once minio is up. Exits when done.
  minio-init:
    image: quay.io/minio/mc:RELEASE.2025-08-13T08-35-41Z
    depends_on:
      minio:
        condition: service_healthy
    environment:
      S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID:-rushsite}
      S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY:-rushsite-dev-secret}
      S3_BUCKET: ${S3_BUCKET:-rushsite-demos}
    entrypoint:
      - /bin/sh
      - -c
      - |
        mc alias set local http://minio:9000 "$$S3_ACCESS_KEY_ID" "$$S3_SECRET_ACCESS_KEY" &&
        mc mb --ignore-existing "local/$$S3_BUCKET"
    restart: "no"

  api:
    build:
      context: .
      dockerfile: infra/docker/api.Dockerfile
    image: rushsite/api:${IMAGE_TAG:-dev}
    restart: unless-stopped
    environment: *api-env
    # Lets the API reach the host agent on port 8080.
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      - "127.0.0.1:3001:3001"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:3001/health >/dev/null || exit 1"]
      interval: 10s
      timeout: 3s
      start_period: 20s
      retries: 6

  web:
    build:
      context: .
      dockerfile: infra/docker/web.Dockerfile
      args:
        # Baked into the client bundle at build time.
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:3001}
        NEXT_PUBLIC_WS_URL: ${NEXT_PUBLIC_WS_URL:-}
    image: rushsite/web:${IMAGE_TAG:-dev}
    restart: unless-stopped
    environment:
      NODE_ENV: ${NODE_ENV:-development}
      PORT: "3000"
      HOSTNAME: 0.0.0.0
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:3001}
      PUBLIC_URL: ${PUBLIC_URL:-http://localhost:3000}
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "127.0.0.1:3000:3000"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:3000/ >/dev/null || exit 1"]
      interval: 10s
      timeout: 3s
      start_period: 30s
      retries: 6

networks:
  default:
    name: rushsite
    # Fixed bridge name and subnet so host firewall rules for the agent stay stable.
    driver_opts:
      com.docker.network.bridge.name: rushsite0
    ipam:
      config:
        - subnet: 172.30.0.0/24

volumes:
  pgdata:
  redisdata:
  miniodata:
