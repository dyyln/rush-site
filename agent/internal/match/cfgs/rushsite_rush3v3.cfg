// rushsite 3v3 Rush. Valve's Rush rules, no tweaks.
// gamemode_rush.cfg runs on map load and the map script drives the rules.
// Only set things here that do not change the rules.
// Leave mp_match_end_restart alone. The match ends on the plugin's match_end event.
bot_quota 0
bot_quota_mode normal
bot_kick
mp_autoteambalance 0
mp_limitteams 0
