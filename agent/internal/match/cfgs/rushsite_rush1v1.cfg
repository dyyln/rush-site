// rushsite 1v1 Rush test queue. Same settings as the 3v3 Rush cfg.
// Valve's Rush rules, no tweaks.
// Valve's gamemode_rush.cfg runs on map load and the map script drives the rules.
// The plugin execs this file again at match start, so it must stay safe to run mid-game.
// Only set things here that do not change the rules.
// Leave mp_match_end_restart alone. The match ends on the plugin's match_end event.
bot_quota 0
bot_quota_mode normal
bot_kick
mp_autoteambalance 0
mp_limitteams 0
