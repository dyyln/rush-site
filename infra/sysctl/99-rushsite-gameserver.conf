# Network tuning for many CS2 servers on one box.
# Install to /etc/sysctl.d/ then run: sysctl --system

# Larger socket buffers for bursty UDP game traffic.
net.core.rmem_default = 1048576
net.core.rmem_max = 16777216
net.core.wmem_default = 1048576
net.core.wmem_max = 16777216
net.ipv4.udp_rmem_min = 16384
net.ipv4.udp_wmem_min = 16384

# Queue more packets per interface before the kernel drops them.
net.core.netdev_max_backlog = 250000
net.core.netdev_budget = 600

# Low latency qdisc and modern congestion control for the web side.
net.core.default_qdisc = fq
net.ipv4.tcp_congestion_control = bbr

# Web and API connection headroom.
net.core.somaxconn = 65535
net.ipv4.tcp_max_syn_backlog = 65535
net.ipv4.ip_local_port_range = 32768 60999
net.ipv4.tcp_fin_timeout = 15
net.ipv4.tcp_tw_reuse = 1

# Connection tracking headroom for many UDP clients.
net.netfilter.nf_conntrack_max = 1048576
net.netfilter.nf_conntrack_udp_timeout = 30
net.netfilter.nf_conntrack_udp_timeout_stream = 120

# Keep game processes in RAM.
vm.swappiness = 1

# Many open files across CS2 processes.
fs.file-max = 2097152
fs.inotify.max_user_watches = 524288
