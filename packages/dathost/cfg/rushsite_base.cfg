// Shared settings for every rushsite match on DatHost. The generated server.cfg execs this first.
// Password, hostname, team names and the mode cfg come from server.cfg. GOTV and rcon come from DatHost settings.
sv_lan 0
sv_hibernate_when_empty 0
sv_allow_votes 0
bot_quota 0
bot_kick
tv_enable 1
tv_delay 105
tv_autorecord 0
sv_logfile 1
log on
